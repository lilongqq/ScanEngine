kafka:
  file_topic: data_p_file
  text_topic: data_p_meta
  definition: se_definition
  attributes: se_attributes
  partition: 0
  status: data_p_status
  unprocessed: data_audit_failure
  processed: data_audit_success
  filter: data_audit_failure
  producer:
    bootstrap_servers: kafka:9092
    retries: 3
    max_request_size: 5242880
    batch_size: 1048576
    buffer_memory: 67108864
    linger_ms: 100
    retry_backoff_ms: 500
    reconnect_backoff_ms: 1000
    max_block_ms: 600000
    request_timeout_ms: 600000
  consumer:
    bootstrap_servers: kafka:9092
    group_id: ScanEngine
    auto_offset_reset: earliest

flask:
  flask_response_timeout: 5 # 5 seconds

executor:
  max_workers: &max_workers 8
  max_queue: 16

