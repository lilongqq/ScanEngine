logging:
  version: 1
  root:
    handlers:
      - console
      - file
    level: NOTSET
  handlers:
    console:
      class: logging.StreamHandler
      formatter: default
      level: INFO
      stream: ext://sys.stdout
    file:
      backupCount: 3
      class: logging.handlers.RotatingFileHandler
      encoding: utf-8
      errors: replace
      filename: log/ScanEngine.log
      formatter: default
      level: INFO
      maxBytes: 10485760
  loggers:
    paramiko:
      level: WARNING
      propagate: true
    httpx:
      level: WARNING
      propagate: true
  formatters:
    brief:
      format: "%(message)s"
    default:
      datefmt: "%Y-%m-%d %H:%M:%S"
      format: "%(asctime)s %(levelname)-8s %(name)-15s %(lineno)-4d %(threadName)-18s--%(thread)-17d %(message)s"

dbp:
  socket:
    ip: db_proxy
    port: 9981
    timeout: 1000000
  binary:
    fetch_size: 100
    limit: 10
  string:
    fetch_size: 10000
    limit: 1000
    piece: 1000

  noschema:
    - neo4j
    - neo4jv3
    - janusgraph03
    - elasticsearch
    - elasticsearch7x
    - tinkerpop
    - access
    - sqlite

hbase:
  limit: 100

lotus:
  socket:
    ip: lotus
    port: 9982
    timeout: 1000000
  email:
    From: item[@name='From']/text
    To: item[@name='SendTo']//text
    cc: item[@name='CopyTo']//text
    Subject: item[@name='Subject']/text
    bcc: item[@name='BlindCopyTo']//text
  file:
    item: item[@name='$FILE']
    file: object/file
    filedata: filedata

email:
  headers:
    - From
    - Sender
    - Reply-To
    - Resent-Reply-To
    - Resent-From
    - Resent-Sender
    - Date
    - Resent-Date
    - To
    - Resent-To
    - cc
    - Resent-cc
    - bcc
    - Resent-bcc
    - Message-ID
    - Resent-Message-ID
    - In-Reply-To
    - References
    - Keywords
    - Subject
    - Comments
    - Encrypted
  id:
    - 163.com

